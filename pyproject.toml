[project]
name = "chessprograms"
version = "0.1.1"
description = "Chess game analysis and processing toolkit"
authors = [
    { name = "Kamil Kręcigłowa" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "python-chess>=1.999",
    "numpy>=1.26",
    "chess>=1.11.2",
    "aiohttp>=3.14.3",
]

[project.scripts]
chessprograms = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/"]



[dependency-groups]
dev =[
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
